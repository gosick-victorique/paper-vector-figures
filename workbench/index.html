<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Figure Studio · 论文绘图工作台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="editor.css"><link rel="stylesheet" href="paper-inspiration.css"><link rel="stylesheet" href="agent/panel.css"><link rel="stylesheet" href="workbench.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">f<span>°</span></span> Figure Studio </div><div class="project-title" id="project-title">未命名</div><div class="top-actions"><span id="save-state" class="saved">● 本地自动保存</span><button id="new-board">＋ 新建画板</button><button id="save-version">保存版本</button><button id="make-task" class="primary">生成图片</button></div></header>
<div class="workspace">
<aside class="sidebar">
<h1>项目</h1>
<div class="paper-card"><span class="paper-icon">▤</span><div><strong id="paper-name">未命名</strong></div><span class="ready-dot"></span></div>
<div class="board-picker"><select id="board-select" aria-label="切换画板"></select><button id="rename-board" title="重命名画板" aria-label="重命名画板">✎</button></div><label class="field-label" for="purpose">图片类型</label><select id="purpose"><option>方法总览 · Overview</option><option>核心机制 · Mechanism</option><option>概念说明 · Concept</option></select>
<div class="section-heading"><h2>图层与组件</h2><span id="object-count"></span></div><input id="layer-search" type="search" placeholder="搜索组件或标签…" aria-label="搜索组件或标签"><nav id="layers" aria-label="图层"></nav>

<div class="history-section"><div class="section-heading"><h2>版本</h2><span id="version-count">1</span></div><div id="versions"></div></div>

</aside>
<main>
<div class="canvas-toolbar"><div class="tool-group"><div class="mode-toggle" aria-label="选择层级"><button id="mode-group" class="active">分组</button><button id="mode-component">组件</button><button id="mode-primitive">图元</button></div><button id="pan-tool" title="空格拖动 / 中键拖动" aria-label="平移画布" aria-pressed="false">平移</button><button id="box-select" title="拖动框选；也可在空白处拖动">▧ 框选</button><span class="separator"></span><button id="undo" title="撤销 Ctrl+Z" aria-label="撤销">↶</button><button id="redo" title="重做 Ctrl+Shift+Z" aria-label="重做">↷</button></div><div class="toolbar-meta"><button id="zoom-out" aria-label="缩小">−</button><label class="zoom-input"><input id="zoom-input" type="number" min="10" max="800" step="10" value="100" aria-label="画板缩放百分比"><span>%</span></label><span id="zoom-label" hidden>100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应</button></div></div>
<div class="board-heading"><div><span class="eyebrow"><span id="board-name">画板 1</span> · 180 × 111 mm</span><h2 id="board-purpose">方法总览</h2></div><div class="canvas-status" id="selection-status">逐组件编辑</div></div>
<div id="canvas-scroll" tabindex="0" aria-label="画布视图"><div id="stage-wrap"><div id="stage"></div></div></div>
<div class="canvas-hint"><span>滚轮缩放 · 空格平移 · Shift 多选 · Alt 图元 · 双击改字</span><button id="reset-view">清空画板</button></div>
<section class="bottom-panel"><div class="comment-board"><div class="section-heading"><h2>修改意见 <span id="comment-count">0</span></h2></div><div id="comment-list"></div></div></section>
</main>
<aside class="inspector">
<nav class="inspector-nav" role="tablist" aria-label="工具面板">
<button id="inspector-tab-properties" role="tab" aria-selected="true" aria-controls="inspector-properties" data-inspector="properties">属性</button>
<button id="inspector-tab-assets" role="tab" aria-selected="false" aria-controls="inspector-assets" data-inspector="assets">素材</button>
<button id="inspector-tab-connections" role="tab" aria-selected="false" aria-controls="inspector-connections" data-inspector="connections">连线</button>
<button id="inspector-tab-ai" role="tab" aria-selected="false" aria-controls="inspector-ai" data-inspector="ai">AI 设置</button>
</nav>
<section id="inspector-properties" class="inspector-pane" role="tabpanel" aria-labelledby="inspector-tab-properties">

<div class="inspector-title"><h2 id="selected-title">选择组件</h2><span class="tag" id="selection-tag">COMPONENT</span></div><div id="selected-chips"></div>
<div class="property-card"><div class="lock-row"><span>锁定位置与尺寸</span><button id="lock" class="switch" role="switch" aria-checked="false" aria-label="锁定位置与尺寸"><span></span></button></div>
<div class="geometry"><label>X <input id="position-x" type="number" step="1"></label><label>Y <input id="position-y" type="number" step="1"></label></div>
<button id="object-position" class="wide">应用位置</button><div class="range-label"><label for="scale">缩放</label><span id="scale-value">100%</span></div><input id="scale" type="range" min="40" max="180" value="100">
</div><section id="object-appearance"><div class="section-heading"><h2>尺寸与配色</h2></div><div class="geometry"><label>宽 <input id="object-width" type="number" min="1" step="1"></label><label>高 <input id="object-height" type="number" min="1" step="1"></label></div><label class="scope-note"><input id="object-ratio" type="checkbox" checked> 保持宽高比</label><button id="object-resize" class="wide">应用尺寸</button><button id="object-split" class="wide">拆分图元</button><div class="object-paints"><label>填充 <input id="object-fill" type="color" value="#dfeaf0"><button id="object-set-fill">应用</button><button id="object-no-fill">无填充</button></label><label>描边 <input id="object-stroke" type="color" value="#416f89"><button id="object-set-stroke">应用</button></label><label>文字 <input id="object-text-color" type="color" value="#23313c"><button id="object-set-text">应用</button></label><label>线宽 <input id="object-stroke-width" type="number" min="0" max="20" step="0.5" value="1.5"><button id="object-set-line">应用</button></label><label>透明度 % <input id="object-opacity" type="number" min="0" max="100" value="100"><button id="object-set-opacity">应用</button></label></div></section><div id="text-controls" hidden><label class="field-label" for="element-text">标签文字</label><textarea id="element-text" rows="3"></textarea><button id="apply-text" class="wide">更新标签</button></div>
<details class="property-card"><summary>整图配色</summary><section id="style-panel"><div id="palettes"></div></section>
</details><details class="property-card" open><summary>修改意见</summary><label class="field-label" for="note" id="note-label">修改意见</label><textarea id="note" rows="3" placeholder="如：对齐矩阵，突出差异"></textarea><button id="add-comment" class="primary wide">保存意见</button><div class="scope-note" id="scope-note"></div>
<button id="preview-task" class="wide">任务详情 ↗</button></details></section>
<section id="inspector-assets" class="inspector-pane" role="tabpanel" aria-labelledby="inspector-tab-assets" hidden><div class="pane-heading"><h2>素材库</h2></div><section id="template-panel"><div class="library-heading"><span id="library-count"></span><button id="open-library">展开模板库 ↗</button></div><a class="external-icon-entry" href="external-icons/index.html" target="_blank" rel="noopener">外部 SVG 图标 · 285 个 ↗</a><button id="open-foundations" class="inspiration-open">基础要素库 · 78 种 ↗</button><button id="open-inspiration" class="inspiration-open">论文组件重绘 · 43 种 ↗</button><input id="template-search" type="search" placeholder="搜索：UNet、token、频率、融合…" aria-label="搜索模板"><select id="template-filter" aria-label="模板类别"></select><p class="library-accounting"><span id="library-accounting"></span></p><div id="templates"></div><div class="library-pagination"><button id="template-prev">上一页</button><span id="template-page"></span><button id="template-next">下一页</button></div><div id="template-detail"><div id="template-preview"></div><strong id="template-name"></strong><details class="template-info"><summary>用途与出处</summary><p id="template-hint"></p><div id="template-source"></div></details><label class="field-label" for="template-label">模板标签</label><input id="template-label" type="text" value="模块"><div class="template-params"><label>层数 / 数量 <select id="template-depth"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><label>主色 <input id="template-color" type="color" value="#416f89"></label></div><fieldset id="foundation-options" hidden><legend>基础要素参数</legend><label>线宽 <input id="foundation-stroke" type="number" min="0.5" max="6" step="0.5" value="1.8"></label><label>填充透明度 <input id="foundation-fill" type="range" min="0" max="100" value="12"><output id="foundation-fill-value">12%</output></label><label>线型 <select id="foundation-line"><option value="solid">实线</option><option value="dashed">虚线</option><option value="dotted">点线</option></select></label><div class="foundation-size"><label>插入宽 <input id="foundation-width" type="number" min="16" max="500" value="140"></label><label>插入高 <input id="foundation-height" type="number" min="16" max="400" value="110"></label></div></fieldset><button id="replace-template" class="wide primary">替换所选组件</button><button id="insert-template" class="wide">插入为新组件 ＋</button></div></section>
</section>
<section id="inspector-connections" class="inspector-pane" role="tabpanel" aria-labelledby="inspector-tab-connections" hidden><div class="pane-heading"><h2>模块连线</h2></div></section>
<section id="inspector-ai" class="inspector-pane" role="tabpanel" aria-labelledby="inspector-tab-ai" hidden><div class="pane-heading"><h2>AI 设置</h2></div><div class="integration-note"></div></section>
</aside>
</div>
<dialog id="task-dialog"><div class="dialog-heading"><div><h2>任务详情</h2></div><button id="close-dialog" aria-label="关闭">×</button></div><pre id="task-content"></pre><div class="dialog-actions"><span id="copy-status"></span><button id="download-task">下载任务 JSON</button><button id="copy-task" class="primary">复制提示词</button></div></dialog>
<dialog id="library-dialog"><div class="dialog-heading"><div><h2>组件库</h2></div><button id="close-library" aria-label="关闭模板库">×</button></div><p><span id="library-summary"></span></p><div class="library-filters"><input id="library-search" type="search" placeholder="搜索组件、英文名或用途" aria-label="搜索全部模板"><select id="library-filter" aria-label="模板库类别"></select></div><div class="library-secondary-filters"><select id="library-source-filter" aria-label="论文背景筛选"></select><select id="library-view-filter" aria-label="方案显示方式"><option value="families" selected>独立条目 · 默认</option><option value="foundations">基础图形要素 · 78 种</option><option value="paper-patterns">论文组件重绘 · 43 种</option><option value="base">仅基础组件</option><option value="mechanisms">仅独立机制</option><option value="new">本次新增条目</option><option value="all">含全部构图变体</option><option value="flow">紧凑关系构图</option><option value="focus">核心展开构图</option><option value="column">纵向接口构图</option><option value="spatial">空间分层构图</option></select><span id="library-results"></span></div><div id="library-grid"></div><div class="library-pagination"><button id="library-prev">上一页</button><span id="library-page"></span><button id="library-next">下一页</button></div></dialog>
<dialog id="inspiration-dialog"><div class="dialog-heading"><div><h2>论文组件重绘</h2></div><button id="close-inspiration" aria-label="关闭论文参考">×</button></div><div id="inspiration-gallery"></div></dialog><div id="toast" role="status"></div><script src="scene-factory.js"></script><script src="board-workspace.js"></script><script src="model.js"></script><script src="connections.js"></script><script src="object-edit.js"></script><script src="templates.js"></script><script src="paper-library.js"></script><script src="paper-renderer.js"></script><script src="semantic-library.js"></script><script src="paper-inspiration-data.js"></script><script src="paper-inspired-templates.js"></script><script src="paper-inspiration-ui.js"></script><script src="foundation-library.js"></script><script src="agent/patch-contract.js"></script><script src="canvas-view.js"></script><script src="workbench-layout.js"></script><script src="direct-edit.js"></script><script src="primitive-geometry.js"></script><script src="primitive-edit.js"></script><script src="canvas-text.js"></script><script src="canvas-draw.js"></script><script src="canvas-context-menu.js"></script><script src="canvas-edit.js"></script><script src="app-v2.js"></script><script src="media-import.js"></script><script src="connection-ui.js"></script><script src="canvas-questions.js"></script><script src="agent/client.js"></script>
</body></html>
