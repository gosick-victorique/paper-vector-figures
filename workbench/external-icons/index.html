<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载的 SVG 图标 · 论文绘图素材</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#243b49;font:14px/1.65 Arial,"Microsoft YaHei",sans-serif}main{max-width:1420px;margin:auto;padding:40px 28px}h1{font-size:32px;line-height:1.3;margin:12px 0}header p{max-width:900px;color:#60727c}a{color:#326b85;text-decoration:none}a:hover{text-decoration:underline}.eyebrow{letter-spacing:.15em;font-size:11px;color:#a06e37}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}.stat{padding:16px 24px;background:white;border:1px solid #dbe3e8;border-radius:9px}.stat strong{font-size:25px;padding-right:12px}.source-links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;background:#f3f6f8f0;padding:16px 0;z-index:1}input,select,button{font:inherit;border:1px solid #cddae0;border-radius:6px;padding:9px;background:white;color:#354f5c}input[type=search]{flex:1;min-width:260px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px}.card{min-width:0;background:white;border:1px solid #dde5e9;border-radius:9px;padding:15px}.art{display:flex;height:92px;align-items:center;justify-content:center;background:#f8fafb;border-radius:6px;margin-bottom:12px}.art img{width:48px;height:48px}.name{font-size:13px;font-weight:600;overflow-wrap:anywhere;min-height:43px}.category{font-size:10px;color:#6d818c;min-height:32px}.meta{font-size:10px;color:#8c673c;margin-top:8px}.actions{display:flex;gap:12px;font-size:11px;margin-top:9px}.pagination{display:flex;align-items:center;justify-content:center;gap:16px;margin:25px 0}.summary{color:#687d88;font-size:12px;margin:0 0 15px}.badge{font-size:9px;border:1px solid #dfcab2;color:#986c3c;padding:1px 4px;border-radius:3px;margin-left:5px}.empty{padding:30px;color:#71838d}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){main{padding:22px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><header><h1>AI、深度学习与视觉图标</h1><div class="source-links"><a href="../index.html">返回画板 ↗</a><a href="manifest.json">完整来源清单</a><a href="README.md">素材说明与许可</a></div><div id="stats" class="stats"></div><div id="sources" class="source-links"></div></header><div class="toolbar"><input id="search" type="search" placeholder="搜索：人脸、GPU、神经网络、shield、PyTorch…" aria-label="搜索图标"><select id="category" aria-label="用途分类"><option value="all">全部用途</option></select><select id="source" aria-label="图标来源"><option value="all">全部图标集</option></select></div><p class="summary" id="summary"></p><div id="grid" class="grid"></div><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main><script src="catalog.js"></script><script>
const D=DownloadedIcons,$=id=>document.getElementById(id),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=0;const pageSize=60;
const aliases={brain:'脑 神经 智能',network:'网络 神经 图',topology:'拓扑 图网络',bot:'机器人 智能体',agent:'智能体 代理',cpu:'处理器 算力 芯片',gpu:'显卡 算力 训练',memory:'内存 显存',camera:'相机 摄像头 采集',photo:'照片 图像',image:'图像 图片',video:'视频',eye:'视觉 眼睛 可见',scan:'扫描 识别 感知',face:'人脸 面部 身份',fingerprint:'指纹 生物识别',shield:'防御 保护 鲁棒',lock:'锁定 冻结 隐私',bug:'攻击 漏洞',spy:'攻击 隐私 攻击者',incognito:'匿名 隐私',mask:'遮罩 掩膜 隐私',target:'目标 攻击',database:'数据库 数据集',binary:'二值 二进制',cube:'立方体 三维',axis:'坐标 空间',cloud:'云端',chart:'图表 评估 分析',robot:'机器人',satellite:'卫星 遥感',tensor:'张量 框架',transform:'变换',focus:'焦点 聚焦',crop:'裁剪',bounding:'检测框',perspective:'透视',vector:'向量 矢量',model:'模型',ai:'人工智能',filter:'滤波 筛选',funnel:'筛选',math:'数学 公式',hierarchy:'层次 结构',pytorch:'深度学习 框架',opencv:'计算机视觉 图像处理',huggingface:'模型库',scikitlearn:'机器学习'};
function terms(r){return [r.name,r.source,...r.categoryNames,...Object.entries(aliases).filter(([k])=>r.name.includes(k)).map(([,v])=>v)].join(' ').toLowerCase();}
$('stats').innerHTML=`<div class="stat"><strong>${D.count}</strong>SVG 文件</div><div class="stat"><strong>${Object.keys(D.sources).length}</strong>官方图标集</div><div class="stat"><strong>${Object.keys(D.categories).length}</strong>用途分类</div>`;
$('category').innerHTML+=Object.entries(D.categories).map(([id,name])=>`<option value="${id}">${name} · ${D.icons.filter(r=>r.categories.includes(id)).length}</option>`).join('');
$('source').innerHTML+=Object.entries(D.sources).map(([id,s])=>`<option value="${id}">${id} · ${D.icons.filter(r=>r.source===id).length}</option>`).join('');
$('sources').innerHTML=Object.entries(D.sources).map(([id,s])=>`<span><a href="https://github.com/${s.repo}" target="_blank" rel="noopener">${id} ↗</a> · <a href="licenses/${id}-${s.license}">${id==='lucide'?'ISC / MIT':s.spdx} 许可</a></span>`).join('');
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,src=$('source').value,rows=D.icons.filter(r=>(cat==='all'||r.categories.includes(cat))&&(src==='all'||r.source===src)&&terms(r).includes(q)),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages-1);$('summary').textContent=`${rows.length} 个图标`;
$('grid').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map(r=>`<article class="card"><a class="art" href="${r.path}" target="_blank" rel="noopener"><img src="${r.path}" loading="lazy" alt="${escape(r.name)}"></a><div class="name">${escape(r.name)}${r.isBrand?'<span class="badge">品牌</span>':''}</div><div class="category">${r.categoryNames.join(' · ')}</div><div class="meta">${r.source} · ${r.license}</div><div class="actions"><a href="${r.path}" download>下载 SVG</a><a href="${r.sourceUrl}" target="_blank" rel="noopener">原始出处 ↗</a></div></article>`).join('')||'<p class="empty">无匹配图标</p>';$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page===pages-1;}
for(const id of ['search','category','source'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};render();
</script></body></html>
