<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>基础要素库 · Figure Studio</title><link rel="stylesheet" href="../paper-inspiration.css"><style>.inspiration-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.inspiration-image{height:180px}.inspiration-card h3{font-size:16px}.inspiration-card p{font-size:12px}@media(max-width:1050px){.inspiration-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body style="margin:0;background:#f4f6f7"><main class="inspiration-shell"><header><div class="eyebrow">FIGURE BUILDING BLOCKS</div><h1>基础要素，自由组合</h1><p>78 种可编辑 SVG 基础素材，覆盖连线、形状、空间体、网格、标注、设备、场景对象、状态符号和图例。用于搭建图片的视觉语言，不预设论文机制。回到画板的“基础要素库”可调线宽、填充透明度、线型和插入尺寸。</p><a href="../index.html">返回画板 ↗</a></header><div class="inspiration-tools"><input id="search" type="search" aria-label="搜索基础要素" placeholder="搜索箭头、相机、图例…"><select id="category" aria-label="要素类别"><option value="all">全部类别</option></select><span id="count"></span></div><div class="inspiration-grid" id="gallery"></div></main><script src="../templates.js"></script><script src="../paper-library.js"></script><script src="../paper-renderer.js"></script><script src="../semantic-library.js"></script><script src="../paper-inspiration-data.js"></script><script src="../paper-inspired-templates.js"></script><script src="../foundation-library.js"></script><script>
const T=FigureTemplates,filter=document.querySelector('#category'),query=document.querySelector('#search');
filter.innerHTML+=Object.entries(T.foundationGroups).map(([id,[name]])=>`<option value="${id}">${name}</option>`).join('');
function render(){const rows=T.selectCatalog({view:'foundations',category:filter.value,query:query.value});document.querySelector('#count').textContent=rows.length+' 种基础要素';document.querySelector('#gallery').innerHTML=rows.map(t=>`<article class="inspiration-card"><div class="inspiration-meta">${T.categories[t.category]}</div><h3>${t.name}</h3><a class="inspiration-image" href="${t.key}.svg" target="_blank" rel="noopener">${T.markup(t.id)}</a><p>${t.hint}</p><a href="${t.key}.svg" download>下载 SVG</a></article>`).join('');}filter.onchange=query.oninput=render;render();
</script></body></html>
