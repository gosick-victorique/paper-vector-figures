<svg xmlns="http://www.w3.org/2000/svg" width="85mm" height="87.5mm" viewBox="0 0 680 700" role="img" aria-labelledby="title desc">
<title id="title">Token pruning versus P2P computation bypass</title><desc id="desc">Original conceptual schematic. Token pruning removes visual tokens B and C and shortens the sequence. P2P retains A, B, C and text token T at every depth. Side markers denote computed projections or cached early and late means. The bottom detail c selects a late-layer MLP down projection: its multiplication is skipped and its cached output enters the residual addition for token A. Counts and layer spans are illustrative.</desc>
